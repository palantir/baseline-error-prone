buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        classpath 'com.palantir.gradle.jdks:gradle-jdks:0.69.0'
        classpath 'com.palantir.gradle.jdkslatest:gradle-jdks-latest:0.24.0'
        classpath 'com.palantir.gradle.plugintesting:gradle-plugin-testing:0.41.0'
        classpath 'com.palantir.jakartapackagealignment:jakarta-package-alignment:0.6.0'
        classpath 'com.gradle.publish:plugin-publish-plugin:2.0.0'
        classpath 'com.palantir.gradle.externalpublish:gradle-external-publish-plugin:1.27.0'
        classpath 'com.palantir.gradle.failure-reports:gradle-failure-reports:1.18.0'
        classpath 'com.palantir.javaformat:gradle-palantir-java-format:2.82.0'
        classpath 'com.palantir.suppressible-error-prone:gradle-suppressible-error-prone:2.25.0'
        classpath 'com.palantir.gradle.consistentversions:gradle-consistent-versions:3.7.0'
        classpath 'com.palantir.baseline:gradle-baseline-java:6.54.0'
        classpath 'com.palantir.gradle.gitversion:gradle-git-version:4.2.0'
        classpath 'com.palantir.gradle.guide:gradle-guide:1.13.0'
        classpath 'com.palantir.gradle.idea-configuration:gradle-idea-configuration:0.8.0'
        classpath 'com.palantir.gradle.idea-language-injector:gradle-idea-language-injector:0.2.0'
    }
}

apply plugin: 'com.palantir.external-publish'
apply plugin: 'java-gradle-plugin'
apply plugin: 'groovy'
apply plugin: 'com.palantir.baseline'
apply plugin: 'com.palantir.consistent-versions'
apply plugin: 'com.palantir.git-version'
apply plugin: 'com.palantir.gradle-guide'
apply plugin: 'com.palantir.idea-language-injector'
apply plugin: 'com.palantir.jdks'
apply plugin: 'com.palantir.failure-reports'
apply plugin: 'com.palantir.baseline-java-versions'
apply plugin: 'com.palantir.jdks.latest'

version gitVersion()

allprojects {
    apply plugin: 'com.palantir.jakarta-package-alignment'
    apply plugin: 'com.palantir.java-format'

    repositories {
        mavenCentral() { metadataSources { mavenPom(); ignoreGradleMetadataRedirection() } }
        gradlePluginPortal()
    }

    group 'com.palantir.baseline-error-prone'
    version rootProject.version
}

gradlePlugin {
    website = 'https://github.com/palantir/baseline-error-prone'
    vcsUrl = 'https://github.com/palantir/baseline-error-prone'

    plugins {
        baselineErrorPronePlugin {
            id = 'com.palantir.baseline-error-prone'
            displayName = 'Palantir Baseline Error Prone Plugin'
            implementationClass = 'com.palantir.baseline.plugins.BaselineErrorProne'
            description = 'Baseline Error Prone configures error-prone with Palantir-specific.'
            tags.set(['java', 'checkstyle', 'code quality'])
        }
    }
}

javaVersions {
    libraryTarget = 17
}

jdks {
    daemonTarget = 21
}



